<!DOCTYPE html>
<html>
<head>
    <title>AI Courses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/course_styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/button_styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Bangers&display=swap" rel="stylesheet">
</head>
<body class="cosmic-body">
    <header class="cosmic-header">
        <h1>🚀 AI Space Academy</h1>
        <p>Blast off into the world of Artificial Intelligence!</p>
    </header>
    
    <nav class="cosmic-nav">
        <a href="{{ url_for('home') }}">🛸 Home</a>
        <a href="{{ url_for('courses') }}">📚 Courses</a>
        <a href="{{ url_for('quizzes') }}">✨ Quizzes</a>
        <a href="{{ url_for('games') }}">🎮 Games</a>
    </nav>
    
    <main class="course-grid-container">
        <h2 class="cosmic-title">🌟 Available Courses</h2>
        <div class="course-grid">
            {% for course in courses %}
            <div class="course-card cosmic-card" data-course-id="{{ course.id }}">
                <div class="course-badge">{{ course.emoji }}</div>
                <img src="{{ url_for('static', filename='images/' + course.image) }}" 
                     alt="{{ course.title }}"
                     class="course-image"
                     onerror="this.onerror=null; this.src='{{ url_for('static', filename='images/default_course.jpg') }}'">
                <h3>{{ course.title }}</h3>
                <div class="course-meta">
                    <p>⏱️ {{ course.duration }}</p>
                    <p>📊 {{ course.level }}</p>
                </div>
                <a href="{{ url_for('course_detail', course_id=course.id) }}" class="enroll-btn cosmic-button" 
                   style="background: {{ course.color }}">
                    Explore Course 🚀
                </a>
            </div>
            {% endfor %}
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/course_interaction.js') }}"></script>
</body>
</html>
